name: holdings

on:
  schedule:
    - cron: "7,37 * * * *"   # 30분마다: EDINET 대량보유 보고 수집 → data 브랜치 holdings.json
  workflow_dispatch: {}

concurrency:
  group: holdings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 이전 데이터 불러오기(data 브랜치)
        run: |
          git clone --depth 1 -b data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data \
            || mkdir -p data

      - name: 대량보유 보고 수집
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          STATE_DIR: data
          HOLD_BUDGET: "540"
        run: python holdings.py

      - name: 데이터 저장(data 브랜치에 덮어쓰기)
        if: always()
        run: |
          cd data
          rm -rf .git
          git init -q -b data
          git config user.name "jpall-bot"
          git config user.email "jpall-bot@users.noreply.github.com"
          git add -A
          git commit -qm "data $(date -u +%FT%TZ)" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
