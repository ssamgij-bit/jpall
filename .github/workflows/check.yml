name: 배포 전 점검

on:
  push:
    branches: [main]
    paths: ["**.py", ".github/workflows/**"]
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 필요한 패키지
        run: pip install -q -r requirements.txt pyyaml
      - name: 문법 검사 + 불러오기 시험(봇 토큰 없이)
        id: test
        run: |
          python -m py_compile *.py
          python - <<'PY'
          import importlib, sys, os, yaml, glob
          sys.path.insert(0, os.getcwd())
          for m in ("jpall", "xbrl", "jp2ko", "earn", "earn_report", "earn_ir", "earn_opinion", "holdings", "stcrypt"):
              if os.path.exists(m + ".py"):
                  importlib.import_module(m); print("import ok", m)
          for f in glob.glob(".github/workflows/*.yml"):
              yaml.safe_load(open(f)); print("yaml ok", f)
          PY
      - name: IR 페이지 브라우저 열기 시험(실패해도 배포는 막지 않음)
        continue-on-error: true
        run: |
          pip install -q playwright
          python - <<'PY'
          import earn_ir as I, urllib.request
          urls = ['https://www.shiftinc.jp/ir/library/lib02/', 'https://www.example.com/']
          for u in urls:
              try: print('plain', u, len(I._get(u)))
              except Exception as e: print('plain error', u, e)
          for h, u in I.render_pages(urls, 2):
              print('rendered', u, len(h), 'スクリプト' in h, repr(h[:300]))
          PY
      - name: 해외 실행 환경에서 회사 홈페이지 접속 시험(임시)
        continue-on-error: true
        run: |
          python - <<'PY'
          import earn_ir as I, concurrent.futures as cf, sys
          codes = "3697 3030 3177 2927 8237 280A 5817 4673 4317 6224 2722 2305 3922 9628 3915 7928 523A 1434 2404 3077 2459 3562 2872 3192 2698 8260 7581 5527 4760 7035 3608 6150 9993 4668 3201 3075 3222 7818 3935 4992 3181 7373 5578 9778 7370 276A 9647 2999 340A 7049 3083 8200 277A 2936 3139 7713 4270 8127 9978 5078 9982 9168 3991 3892 3815 5967 8783 8887 8244 8008 2337 5018 6532 7074 463A 8908 3967 3172 6505 135A 3536 9837 3645 325A 7434 3996 2186 3543 4432 4015 1418 3021 6058 2669 3548 2735 245A 469A 8143 7357 9238 3810 6543 3223 3826 2484 3168 4430 2411 9602 6182".split()
          def one(c):
              try: h = I.company_site(c)
              except Exception as e: return c, "kabutan-err " + str(e)[:40]
              if not h: return c, "nohome"
              try: I._get(h); return c, "ok"
              except Exception as e: return c, "err " + str(e)[:40]
          res = list(cf.ThreadPoolExecutor(8).map(one, codes))
          from collections import Counter
          print("home fetch:", Counter(r.split(":")[0][:22] for _, r in res).most_common())
          print("blocked:", [(c, r) for c, r in res if r != "ok"][:40])
          try: print("logmi items", len(I.logmi_index(2)))
          except Exception as e: print("logmi err", e)
          try: import json; print("xj raw", len(json.loads(I._get("https://www.xj-storage.jp/public-list/GetList.aspx?company=AS95685&len=80&output=json")).get("items") or []))
          except Exception as e: print("xj err", e)
          PY
      - name: 실패하면 주인에게 텔레그램 알림
        if: failure()
        env:
          EARN_TOKEN: ${{ secrets.EARN_TOKEN }}
          WATCH_KEY: ${{ secrets.WATCH_KEY }}
          SHA: ${{ github.sha }}
          MSG: ${{ github.event.head_commit.message }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request
          sys.path.insert(0, os.getcwd())
          import stcrypt
          st = json.loads(urllib.request.urlopen("https://raw.githubusercontent.com/" + os.environ["GITHUB_REPOSITORY"] + "/state/state.json", timeout=30).read())
          owner = stcrypt.reveal(st).get("owner")
          if isinstance(owner, int) and owner > 0 and os.environ.get("EARN_TOKEN"):
              text = f"⚠️ 배포 전 점검 실패\n커밋 {os.environ['SHA'][:7]}: {(os.environ.get('MSG') or '').splitlines()[0][:80]}\n다음 봇 실행에서 오류가 날 수 있습니다. 로그: {os.environ['URL']}"
              urllib.request.urlopen(urllib.request.Request(f"https://api.telegram.org/bot{os.environ['EARN_TOKEN']}/sendMessage",
                  data=json.dumps({"chat_id": owner, "text": text}).encode(), headers={"content-type": "application/json"}), timeout=30)
              print("alert sent")
          PY
