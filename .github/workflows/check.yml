name: 배포 전 점검

on:
  push:
    branches: [main]
    paths: ["**.py", ".github/workflows/**"]
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 필요한 패키지
        run: pip install -q -r requirements.txt pyyaml
      - name: 문법 검사 + 불러오기 시험(봇 토큰 없이)
        id: test
        run: |
          python -m py_compile *.py
          python - <<'PY'
          import importlib, sys, os, yaml, glob
          sys.path.insert(0, os.getcwd())
          for m in ("jpall", "xbrl", "jp2ko", "earn", "earn_report", "earn_ir", "earn_opinion", "holdings", "stcrypt", "aicache"):
              if os.path.exists(m + ".py"):
                  importlib.import_module(m); print("import ok", m)
          for f in glob.glob(".github/workflows/*.yml"):
              yaml.safe_load(open(f)); print("yaml ok", f)
          # 같은 파일 안에서 전역 이름(변수·함수)을 두 번 정의하면 뒤의 것이 앞의 것을 덮어씀 → 실패 처리(예: _JPS 충돌로 결산 판별이 멈췄던 일)
          import ast
          dup = []
          for f in sorted(glob.glob("*.py")):
              seen = {}
              for n in ast.parse(open(f).read()).body:
                  names = [x.id for x in n.targets if isinstance(x, ast.Name)] if isinstance(n, ast.Assign) else \
                          [n.name] if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) else []
                  for x in names: seen.setdefault(x, []).append(n.lineno)
              dup += [f"{f}: {k} (줄 {v})" for k, v in seen.items() if len(v) > 1]
          if dup: sys.exit("전역 이름 중복 정의:\n" + "\n".join(dup))
          print("no duplicate globals")
          PY
      - name: 실행 시험(게시 없이 2분 돌려 보고, 실행 중 오류가 나면 실패)
        timeout-minutes: 8
        run: |
          pip install -q matplotlib koreanize-matplotlib
          mkdir -p /tmp/dry
          STATE_DIR=/tmp/dry DRY_RUN=1 RUN_SECONDS=120 WATCH_KEY=dummy GATEWAY_URL=off PYTHONUNBUFFERED=1 timeout 360 python earn.py 2>&1 | tee /tmp/dry.log || true
          if grep -q "Traceback" /tmp/dry.log; then echo "::error::실행 중 오류(Traceback)가 났습니다 — 위 로그 확인"; exit 1; fi
          echo "실행 시험 통과"
      - name: IR 페이지 브라우저 열기 시험(실패해도 배포는 막지 않음)
        continue-on-error: true
        run: |
          pip install -q playwright
          python - <<'PY'
          import earn_ir as I, urllib.request
          urls = ['https://www.shiftinc.jp/ir/library/lib02/', 'https://www.example.com/']
          for u in urls:
              try: print('plain', u, len(I._get(u)))
              except Exception as e: print('plain error', u, e)
          for h, u in I.render_pages(urls, 2):
              print('rendered', u, len(h), 'スクリプト' in h, repr(h[:300]))
          PY
      - name: 실패하면 주인에게 텔레그램 알림
        if: failure()
        env:
          EARN_TOKEN: ${{ secrets.EARN_TOKEN }}
          WATCH_KEY: ${{ secrets.WATCH_KEY }}
          SHA: ${{ github.sha }}
          MSG: ${{ github.event.head_commit.message }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request
          sys.path.insert(0, os.getcwd())
          import stcrypt
          st = json.loads(urllib.request.urlopen("https://raw.githubusercontent.com/" + os.environ["GITHUB_REPOSITORY"] + "/state/state.json", timeout=30).read())
          owner = stcrypt.reveal(st).get("owner")
          if isinstance(owner, int) and owner > 0 and os.environ.get("EARN_TOKEN"):
              text = f"⚠️ 배포 전 점검 실패\n커밋 {os.environ['SHA'][:7]}: {(os.environ.get('MSG') or '').splitlines()[0][:80]}\n다음 봇 실행에서 오류가 날 수 있습니다. 로그: {os.environ['URL']}"
              urllib.request.urlopen(urllib.request.Request(f"https://api.telegram.org/bot{os.environ['EARN_TOKEN']}/sendMessage",
                  data=json.dumps({"chat_id": owner, "text": text}).encode(), headers={"content-type": "application/json"}), timeout=30)
              print("alert sent")
          PY
