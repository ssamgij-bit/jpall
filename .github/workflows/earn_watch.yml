name: 봇 상태 감시

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분: 봇들이 멈췄는지 확인(실적 스크리닝·공시 채널·japan stock·뉴스 저장소 봇·맥의 네이버 프리미엄 봇)
    # 예약 실행은 몇 시간씩 밀리기도 해서, 실적 스크리닝 봇이 매 실행 끝에 1시간 넘게 감시가 없었으면 이 감시를 직접 실행함
  workflow_dispatch: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 알림 보낸 기록(watch-state 브랜치) 저장
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4   # 암호화된 주인 ID를 풀 stcrypt.py
      - name: 마지막 상태 저장 시각 확인 → 멈췄으면 주인에게 텔레그램 알림
        env:
          EARN_TOKEN: ${{ secrets.EARN_TOKEN }}
          WATCH_KEY: ${{ secrets.WATCH_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, datetime as dt
          repo = os.environ["REPO"]; tok = os.environ.get("EARN_TOKEN", "")
          def get(u, auth=True):
              h = {"User-Agent": "watch"}
              if auth and "api.github.com" in u: h["Authorization"] = "Bearer " + os.environ["GH_TOKEN"]
              try:
                  return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers=h), timeout=30).read())
              except urllib.error.HTTPError as e:
                  if auth and e.code in (401, 403, 404) and "api.github.com" in u: return get(u, False)   # 다른 저장소(공개)는 인증 없이
                  raise
          import sys; sys.path.insert(0, os.getcwd())
          import stcrypt
          owner = stcrypt.reveal(get(f"https://raw.githubusercontent.com/{repo}/state/state.json")).get("owner")
          if not isinstance(owner, int) or owner <= 0: owner = None
          # 알림 기록(watch-state 브랜치): 같은 문제는 한 번만 알리고(24시간 지나도 그대로면 한 번 더), 복구되면 '복구' 알림
          try: alerted = get(f"https://raw.githubusercontent.com/{repo}/watch-state/watch.json?t={int(time.time())}", False)
          except Exception: alerted = {}
          stale, checked = {}, set()
          def flag(key, text, bad):
              checked.add(key)
              if bad: stale[key] = text
          for br, name in (("earn-state", "실적 스크리닝 봇"), ("state", "일본공시봇(JP_ALL)")):
              c = get(f"https://api.github.com/repos/{repo}/commits/{br}")
              t = dt.datetime.fromisoformat(c["commit"]["committer"]["date"].replace("Z", "+00:00"))
              mins = (dt.datetime.now(dt.timezone.utc) - t).total_seconds() / 60
              print(br, f"{mins:.0f}분 전 저장")
              flag(br, f"{name}: 마지막 실행 기록이 {mins / 60:.1f}시간 전입니다", mins >= 75)
          now = dt.datetime.now(dt.timezone.utc)
          kst_h = (now + dt.timedelta(hours=9)).hour
          # japan stock 봇(Cloudflare, 2분마다): 마지막으로 끝까지 돈 시각
          try:
              h = get("https://jp-disclosure-bot.ssamgij.workers.dev/health")
              m = (time.time() * 1000 - h.get("last_ok", 0)) / 60000
              print("jp-disclosure-bot", f"{m:.0f}분 전 정상 실행")
              flag("jpstock", f"japan stock 봇: 마지막 정상 실행이 {m:.0f}분 전입니다(2분마다 돌아야 함 · Cloudflare 로그 확인 필요)", m >= 20)
          except Exception as e:
              print("jp-disclosure-bot health error", e)
              flag("jpstock", f"japan stock 봇: 상태 확인 실패({str(e)[:60]})", True)
          # 맥에서 도는 네이버 프리미엄 봇: 5분마다 생존 신호. 맥이 잠들면 끊기므로 하루 세 번(09·13·18시)만 알림
          try:
              b = get("https://earn-gateway.ssamgij.workers.dev/beats").get("naver", 0)
              m = (time.time() * 1000 - b) / 60000
              print("naver beat", f"{m:.0f}분 전")
              if 9 <= kst_h < 19:   # 맥은 밤에 잠들 수 있어 낮에만 판단
                  flag("naver", f"네이버 프리미엄 요약 봇(맥): 마지막 신호가 {m / 60:.1f}시간 전입니다(맥이 꺼졌거나 잠자기·봇 중단)", m >= 20)
          except Exception as e:
              print("beats error", e)
          # 뉴스 저장소(jpnews) 봇들: 마지막 실행이 실패했거나, 6.5시간 넘게 새 실행이 없거나, 한 실행이 6.5시간 넘게 안 끝나면
          NAMES = {"run.yml": "일본 뉴스 봇", "highs.yml": "신고가·상승률 봇", "community.yml": "일본 커뮤니티 봇", "morning.yml": "아침 브리핑", "weather.yml": "서울 날씨 알림"}
          for f, name in NAMES.items():
              try:
                  r = (get(f"https://api.github.com/repos/{repo.split('/')[0]}/jpnews/actions/workflows/{f}/runs?per_page=1").get("workflow_runs") or [None])[0]
                  if not r: continue
                  ca = dt.datetime.fromisoformat(r["created_at"].replace("Z", "+00:00"))
                  ua = dt.datetime.fromisoformat(r["updated_at"].replace("Z", "+00:00"))
                  age = lambda t: (now - t).total_seconds() / 60
                  why = None
                  if r["status"] == "completed" and r["conclusion"] not in ("success", "skipped"):
                      why = f"마지막 실행이 실패({r['conclusion']})"
                  elif r["status"] == "completed" and age(ua) >= 390:   # 예약 실행이 6시간마다 있으므로 6.5시간 넘게 새 실행이 없으면
                      why = f"{age(ua) / 60:.1f}시간째 새 실행이 없음"
                  elif r["status"] != "completed" and age(ca) >= 390:
                      why = f"한 실행이 {age(ca) / 60:.1f}시간째 끝나지 않음"
                  print(f, r["status"], r["conclusion"], f"{age(ca):.0f}분 전 시작")
                  flag(f, f"{name}: {why}", bool(why))
              except Exception as e:
                  print(f, "error", e)
          t_now = time.time()
          new = [k for k in stale if t_now - alerted.get(k, 0) > 86400]   # 처음 생긴 문제, 또는 하루 넘게 계속되는 문제
          back = [k for k in list(alerted) if k in checked and k not in stale]   # 알렸던 문제 중 이제 정상인 것
          NAMEK = {"earn-state": "실적 스크리닝 봇", "state": "일본공시봇(JP_ALL)", "jpstock": "japan stock 봇", "naver": "네이버 프리미엄 요약 봇(맥)", **NAMES}
          lines = [stale[k] for k in new] + [f"✅ 복구: {NAMEK.get(k, k)}" for k in back]
          sent = False
          if lines and owner and tok:
              msg = ("⚠️ 봇 상태 감시\n" if new else "") + "\n".join(lines) + ("\nGitHub Actions·Cloudflare 실행 상태를 확인해 주세요." if new else "")
              urllib.request.urlopen(urllib.request.Request(f"https://api.telegram.org/bot{tok}/sendMessage",
                  data=json.dumps({"chat_id": owner, "text": msg}).encode(), headers={"content-type": "application/json"}), timeout=30)
              print("alert sent", new, back); sent = True
          for k in new: alerted[k] = t_now
          for k in back: alerted.pop(k, None)
          json.dump(alerted, open("/tmp/watch.json", "w"))
          print("stale", list(stale), "alerted", list(alerted))
          PY
      - name: 알림 기록 저장(watch-state 브랜치)
        if: always()
        run: |
          [ -f /tmp/watch.json ] || exit 0
          mkdir -p /tmp/ws && cd /tmp/ws && cp /tmp/watch.json .
          git init -q -b watch-state && git config user.name "watch-bot" && git config user.email "watch-bot@users.noreply.github.com"
          git add -A && git commit -qm "watch $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" watch-state
