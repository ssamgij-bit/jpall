name: 봇 상태 감시

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분: 봇들이 멈췄는지 확인(실적 스크리닝·공시 채널·japan stock·뉴스 저장소 봇)
    # 예약 실행은 몇 시간씩 밀리기도 해서, 실적 스크리닝 봇이 매 실행 끝에 1시간 넘게 감시가 없었으면 이 감시를 직접 실행함
  workflow_dispatch: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 알림 보낸 기록(watch-state 브랜치) 저장
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4   # 암호화된 주인 ID를 풀 stcrypt.py
      - run: pip install -q jpholiday || true   # 일본 공휴일(휴장일엔 공시 0건이 정상)
      - name: 마지막 상태 저장 시각 확인 → 멈췄으면 주인에게 텔레그램 알림
        env:
          EARN_TOKEN: ${{ secrets.EARN_TOKEN }}
          WATCH_KEY: ${{ secrets.WATCH_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, datetime as dt
          repo = os.environ["REPO"]; tok = os.environ.get("EARN_TOKEN", ""); DRY = os.environ.get("DRY_RUN") == "1"
          def get(u, auth=True):
              h = {"User-Agent": "watch"}
              if auth and "api.github.com" in u: h["Authorization"] = "Bearer " + os.environ["GH_TOKEN"]
              try:
                  return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers=h), timeout=30).read())
              except urllib.error.HTTPError as e:
                  if auth and e.code in (401, 403, 404) and "api.github.com" in u: return get(u, False)   # 다른 저장소(공개)는 인증 없이
                  raise
          import sys; sys.path.insert(0, os.getcwd())
          import stcrypt
          owner = stcrypt.reveal(get(f"https://raw.githubusercontent.com/{repo}/state/state.json")).get("owner")
          if not isinstance(owner, int) or owner <= 0: owner = None
          # 알림 기록(watch-state 브랜치): 같은 문제는 한 번만 알리고(24시간 지나도 그대로면 한 번 더), 복구되면 '복구' 알림
          try: alerted = get(f"https://raw.githubusercontent.com/{repo}/watch-state/watch.json?t={int(time.time())}", False)
          except Exception: alerted = {}
          stale, checked = {}, set()
          def flag(key, text, bad):
              checked.add(key)
              if bad: stale[key] = text
          for br, name in (("earn-state", "실적 스크리닝 봇"), ("state", "일본공시봇(JP_ALL)")):
              c = get(f"https://api.github.com/repos/{repo}/commits/{br}")
              t = dt.datetime.fromisoformat(c["commit"]["committer"]["date"].replace("Z", "+00:00"))
              mins = (dt.datetime.now(dt.timezone.utc) - t).total_seconds() / 60
              print(br, f"{mins:.0f}분 전 저장")
              flag(br, f"{name}: 마지막 실행 기록이 {mins / 60:.1f}시간 전입니다", mins >= 75)
          now = dt.datetime.now(dt.timezone.utc)
          kst_h = (now + dt.timedelta(hours=9)).hour
          # japan stock 봇(Cloudflare, 2분마다): 마지막으로 끝까지 돈 시각
          try:
              h = get("https://jp-disclosure-bot.ssamgij.workers.dev/health")
              m = (time.time() * 1000 - h.get("last_ok", 0)) / 60000
              print("jp-disclosure-bot", f"{m:.0f}분 전 정상 실행")
              flag("jpstock", f"japan stock 봇: 마지막 정상 실행이 {m:.0f}분 전입니다(2분마다 돌아야 함 · Cloudflare 로그 확인 필요)", m >= 20)
          except Exception as e:
              print("jp-disclosure-bot health error", e)
              flag("jpstock", f"japan stock 봇: 상태 확인 실패({str(e)[:60]})", True)
          # 맥에서 도는 네이버 프리미엄 봇: 5분마다 생존 신호(알림 없이 기록만)
          try:
              b = get("https://earn-gateway.ssamgij.workers.dev/beats").get("naver", 0)
              m = (time.time() * 1000 - b) / 60000
              print("naver beat", f"{m:.0f}분 전")
              # 주인 요청(10/31): 네이버 프리미엄 요약 봇은 멈춤·복구 알림을 보내지 않음(기록만)
          except Exception as e:
              print("beats error", e)
          # 뉴스 저장소(jpnews) 봇들: 마지막 실행이 실패했거나, 6.5시간 넘게 새 실행이 없거나, 한 실행이 6.5시간 넘게 안 끝나면
          NAMES = {"run.yml": "일본 뉴스 봇", "highs.yml": "신고가·상승률 봇", "community.yml": "일본 커뮤니티 봇", "morning.yml": "아침 브리핑", "weather.yml": "서울 날씨 알림"}
          for f, name in NAMES.items():
              try:
                  r = (get(f"https://api.github.com/repos/{repo.split('/')[0]}/jpnews/actions/workflows/{f}/runs?per_page=1").get("workflow_runs") or [None])[0]
                  if not r: continue
                  ca = dt.datetime.fromisoformat(r["created_at"].replace("Z", "+00:00"))
                  ua = dt.datetime.fromisoformat(r["updated_at"].replace("Z", "+00:00"))
                  age = lambda t: (now - t).total_seconds() / 60
                  why = None
                  # 새 실행이 없어도 되는 시간: 자주 도는 봇 6.5시간, 하루 한 번 도는 봇 26시간(평일만 도는 봇은 주말 건너 74시간)
                  lim = {"run.yml": 390, "community.yml": 390}.get(f, 1560)
                  if f in ("highs.yml", "morning.yml") and (now + dt.timedelta(hours=9)).weekday() in (5, 6, 0): lim = 4440
                  if r["status"] == "completed" and r["conclusion"] not in ("success", "skipped"):
                      why = f"마지막 실행이 실패({r['conclusion']})"
                  elif r["status"] == "completed" and age(ua) >= lim:
                      why = f"{age(ua) / 60:.1f}시간째 새 실행이 없음"
                  elif r["status"] == "in_progress" and age(ua) >= 390:   # 작업 시작(대기 끝) 뒤 6.5시간: GitHub 실행은 6시간이 최대라 멈춘 것
                      why = f"한 실행이 {age(ua) / 60:.1f}시간째 끝나지 않음"
                  elif r["status"] != "completed" and age(ca) >= 720:
                      why = f"실행이 {age(ca) / 60:.1f}시간째 대기 중(시작 못 함)"
                  print(f, r["status"], r["conclusion"], f"{age(ca):.0f}분 전 시작")
                  flag(f, f"{name}: {why}", bool(why))
              except Exception as e:
                  print(f, "error", e)
          t_now = time.time()
          alerted = {k: v for k, v in alerted.items() if k.startswith("_") or isinstance(v, (int, float))}
          new = [k for k in stale if t_now - alerted.get(k, 0) > 86400]   # 처음 생긴 문제, 또는 하루 넘게 계속되는 문제
          back = [k for k in list(alerted) if not k.startswith("_") and k in checked and k not in stale]   # 알렸던 문제 중 이제 정상인 것
          NAMEK = {"earn-state": "실적 스크리닝 봇", "state": "일본공시봇(JP_ALL)", "jpstock": "japan stock 봇", "naver": "네이버 프리미엄 요약 봇(맥)", **NAMES}
          lines = [stale[k] for k in new] + [f"✅ 복구: {NAMEK.get(k, k)}" for k in back]
          sent = False
          if lines and owner and tok and not DRY:
              msg = ("⚠️ 봇 상태 감시\n" if new else "") + "\n".join(lines) + ("\nGitHub Actions·Cloudflare 실행 상태를 확인해 주세요." if new else "")
              urllib.request.urlopen(urllib.request.Request(f"https://api.telegram.org/bot{tok}/sendMessage",
                  data=json.dumps({"chat_id": owner, "text": msg}).encode(), headers={"content-type": "application/json"}), timeout=30)
              print("alert sent", new, back); sent = True
          for k in new: alerted[k] = t_now
          for k in back: alerted.pop(k, None)
          # 매일 아침 7시 이후 첫 감시: 문제가 없어도 한 줄 요약(조용한 고장·감시 자체의 멈춤을 알아채기 위해)
          kst = now + dt.timedelta(hours=9)
          if kst.hour >= 7 and alerted.get("_daily") != kst.strftime("%Y%m%d") and owner and tok and not DRY:
              okn = [NAMEK.get(k, k) for k in sorted(checked) if k not in stale]
              bad = [stale[k] for k in stale]
              # 조용한 고장 감지: 어제(KST) 봇별 작동량 — 돌기는 하는데 결과가 비거나 AI 요약이 계속 실패하는 경우
              act = []
              try:
                  y = kst - dt.timedelta(days=1)
                  yd = y.strftime("%Y%m%d")
                  try:
                      import jpholiday; jp_open = y.weekday() < 5 and not jpholiday.is_holiday(y.date())
                  except Exception:
                      jp_open = y.weekday() < 5
                  def raw(path, alt=None):
                      for u in [path] + ([alt] if alt else []):
                          try: return get(f"{u}?t={int(time.time())}", False)
                          except Exception: pass
                      return {}
                  owner_ = repo.split("/")[0]
                  js = raw(f"https://raw.githubusercontent.com/{repo}/state/state.json")
                  c = (js.get("cnt") or {}).get(yd)
                  if c is not None:
                      ai, af, po = c.get("ai", 0), c.get("ai_fail", 0), c.get("post", 0)
                      act.append(f"• 공시 채널: 게시 {po}건 · AI 요약 실패 {af}/{ai}")
                      if jp_open and po == 0: bad.append("공시 채널: 일본 영업일인데 어제 게시 0건(공시 수집 확인 필요)")
                      if ai >= 6 and af / ai >= 0.5: bad.append(f"공시 채널: AI 요약 실패 {af}/{ai}(AI 키 한도 의심)")
                  ns = raw(f"https://raw.githubusercontent.com/{owner_}/jpnews/state/state.json", f"https://raw.githubusercontent.com/{owner_}/jpnews/main/state.json")
                  c = (ns.get("cnt") or {}).get(yd)
                  sent24 = sum(1 for r in (ns.get("recent") or []) if r.get("sent") and time.time() - r.get("ts", 0) < 86400)
                  if c is not None:
                      se, no, tf = c.get("sent", 0), c.get("nosum", 0), c.get("tri_fail", 0)
                      act.append(f"• 뉴스봇: 발송 {se}건 · 요약 실패 {no}건 · 선별 실패 {tf}회")
                      if se >= 4 and no / se >= 0.5: bad.append(f"뉴스봇: 요약 실패 {no}/{se}(AI 키 한도 의심)")
                      if tf >= 10: bad.append(f"뉴스봇: AI 선별 실패 {tf}회(AI 키 한도 의심)")
                  if ns and sent24 == 0: bad.append("뉴스봇: 최근 24시간 발송 0건")
                  es = raw(f"https://raw.githubusercontent.com/{repo}/earn-state/earn.json")
                  if es:
                      n_log = sum(1 for x in (es.get("log") or []) if x and x[0] == yd)
                      cards = ((es.get("stats") or {}).get(yd) or {}).get("cards", 0)
                      act.append(f"• 실적 스크리닝: 검토 {n_log}종목 · 채널 카드 {cards}건")
                      rs = (es.get("stats") or {}).get(yd) or {}
                      rb = rs.get("rep_built", 0)
                      if rb:
                          act.append(f"• 실적 리포트: 생성 {rb}건(AI 실패 {rs.get('rep_ai_fail', 0)}) · 이번 분기 설명 자료 {rs.get('rep_mat', 0)} · "
                                     f"이전 IR 참고 {rs.get('rep_refs', 0)}개 · 캐파 자료 {rs.get('rep_capa', 0)} · 분기 분리 실패 {rs.get('rep_qfail', 0)}")
                          if rb >= 4 and rs.get("rep_ai_fail", 0) / rb >= 0.5: bad.append(f"실적 리포트: AI 실패 {rs.get('rep_ai_fail', 0)}/{rb}(AI 키 한도 의심)")
                          if rb >= 4 and rs.get("rep_qfail", 0) / rb >= 0.5: bad.append(f"실적 리포트: 3개월 사업부 분리 실패 {rs.get('rep_qfail', 0)}/{rb}")
                  ms = raw(f"https://raw.githubusercontent.com/{owner_}/jpnews/state/morning_state.json", f"https://raw.githubusercontent.com/{owner_}/jpnews/main/morning_state.json")
                  if y.weekday() < 5 and ms:
                      ok_m = ms.get("sent") == y.strftime("%Y-%m-%d") or ms.get("sent", "") > y.strftime("%Y-%m-%d")
                      act.append(f"• 아침 PDF: {y:%m/%d} {'발송 ✓' if ok_m else '발송 안 됨'}")
                      if not ok_m: bad.append(f"아침 PDF: {y:%m/%d} 발송 기록 없음")
                  cs = raw(f"https://raw.githubusercontent.com/{owner_}/jpnews/state/community_state.json", f"https://raw.githubusercontent.com/{owner_}/jpnews/main/community_state.json")
                  if cs:
                      last = max([x.get("ts", 0) for x in (cs.get("pdfq") or [])] or [0])
                      h_ = (time.time() - last) / 3600
                      act.append(f"• 커뮤니티 정리: 마지막 {h_:.0f}시간 전")
                      if h_ > 30: bad.append(f"커뮤니티 정리: {h_:.0f}시간째 새 정리 없음")
              except Exception as e:
                  print("activity check error", e)
              msg = (f"🟢 봇 상태 아침 점검: {len(okn)}개 모두 정상" if not bad else f"🟡 봇 상태 아침 점검: 정상 {len(okn)}개 · 문제 {len(bad)}개\n" + "\n".join(bad))
              msg += "\n(" + ", ".join(okn) + ")" if okn and not bad else ""
              if act: msg += f"\n\n어제({y:%m/%d}) 작동\n" + "\n".join(act)
              urllib.request.urlopen(urllib.request.Request(f"https://api.telegram.org/bot{tok}/sendMessage",
                  data=json.dumps({"chat_id": owner, "text": msg, "disable_notification": not bad}).encode(), headers={"content-type": "application/json"}), timeout=30)
              alerted["_daily"] = kst.strftime("%Y%m%d"); print("daily summary sent")
          json.dump(alerted, open("/tmp/watch.json", "w"))
          print("stale", list(stale), "alerted", list(alerted))
          PY
      - name: 알림 기록 저장(watch-state 브랜치)
        if: always()
        run: |
          [ -f /tmp/watch.json ] || exit 0
          mkdir -p /tmp/ws && cd /tmp/ws && cp /tmp/watch.json .
          git init -q -b watch-state && git config user.name "watch-bot" && git config user.email "watch-bot@users.noreply.github.com"
          git add -A && git commit -qm "watch $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" watch-state
