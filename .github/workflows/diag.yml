name: diag
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          curl -s "https://api.telegram.org/bot${T}/getMe" | python3 -c 'import sys,json; r=json.load(sys.stdin); print("getMe ok:", r.get("ok"), "username:", (r.get("result") or {}).get("username"), r.get("description",""))'
          curl -s "https://api.telegram.org/bot${T}/getWebhookInfo" | python3 -c 'import sys,json; r=json.load(sys.stdin).get("result",{}); print("webhook set:", bool(r.get("url")), "pending:", r.get("pending_update_count"))'
          curl -s "https://api.telegram.org/bot${T}/getUpdates" | python3 -c 'import sys,json; r=json.load(sys.stdin); print("updates ok:", r.get("ok"), r.get("description","")); [print(list(u.keys())[1], ((u.get("my_chat_member") or u.get("channel_post") or u.get("message") or {}).get("chat") or {}).get("type"), ((u.get("my_chat_member") or u.get("channel_post") or u.get("message") or {}).get("chat") or {}).get("id")) for u in r.get("result",[])]'
