name: 실적 스크리닝

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"   # 10분마다 시작 시도(실행 중이면 대기) → 끊김 없이 이어서 실행(버튼 즉시 응답)
  workflow_dispatch:
    inputs:
      test_day:
        description: "YYYYMMDD — 그날 결산단신을 다시 판별해 채널에 게시(테스트용, 비우면 평소 실행)"
        required: false
        default: ""
      test_report:
        description: "종목 코드(쉼표로 여러 개) — 요청 분석 카드와 리포트·IR 요약을 바로 만들어 채널에 게시(테스트용)"
        required: false
        default: ""

concurrency:
  group: earn
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # 끝날 때 다음 실행을 직접 이어 붙이기 위해

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt matplotlib koreanize-matplotlib   # 한글 글꼴(나눔고딕)은 koreanize-matplotlib에 포함

      - name: PDF 도구(pdftotext)
        run: which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: 이전 상태 불러오기(earn-state 브랜치)
        run: |
          git clone --depth 1 -b earn-state "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" estate \
            || mkdir -p estate

      - name: 판별·카드 게시
        env:
          EARN_TOKEN: ${{ secrets.EARN_TOKEN }}
          EARN_CHANNEL: ${{ secrets.EARN_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.EARN_GEMINI_KEY || secrets.GEMINI_API_KEY }}   # 전용 키가 있으면 그것을 먼저 사용
          GEMINI_API_KEY_2: ${{ secrets.EARN_GEMINI_KEY2 }}   # 리포트·IR·시장 반응용 보조 키(없으면 위 키를 같이 씀)
          GATEWAY_URL: ${{ secrets.EARN_GATEWAY_URL || 'https://earn-gateway.ssamgij.workers.dev' }}   # 즉시 응답 관문(Cloudflare Worker). 비밀값 EARN_GATEWAY_URL=off 면 예전 방식
          TEST_DAY: ${{ github.event.inputs.test_day }}
          TEST_REPORT: ${{ github.event.inputs.test_report }}
          RUN_SECONDS: "1680"
        run: python earn.py

      - name: 상태 저장(earn-state 브랜치에 덮어쓰기)
        if: always()
        run: |
          cd estate
          rm -rf .git
          git init -q -b earn-state
          git config user.name "earn-bot"
          git config user.email "earn-bot@users.noreply.github.com"
          git add -A
          git commit -qm "state $(date -u +%FT%TZ)" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" earn-state

      - name: 다음 실행 이어 붙이기(예약 실행이 늦거나 안 돌 때 대비)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 이미 대기 중이거나 실행 중인 다른 실적 스크리닝 실행이 있으면 건너뜀(중복 방지)
          n=$(gh run list -R "${{ github.repository }}" --workflow earn.yml --limit 20 --json status,databaseId \
               -q '[.[] | select((.status=="queued" or .status=="in_progress" or .status=="pending" or .status=="waiting") and .databaseId != ${{ github.run_id }})] | length')
          if [ "${n:-0}" = "0" ]; then gh workflow run earn.yml -R "${{ github.repository }}" --ref main && echo "다음 실행 요청"; else echo "다른 실행 $n개 있음 → 건너뜀"; fi
